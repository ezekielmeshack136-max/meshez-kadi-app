<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thibitisha Uwepo - RSVP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1340A8 0%, #1A56DB 50%, #2563EB 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .icon { font-size: 56px; margin-bottom: 16px; }

  h1 {
    font-size: 20px;
    color: #1E293B;
    margin-bottom: 8px;
  }

  p {
    font-size: 14px;
    color: #475569;
    line-height: 1.6;
  }

  .guest-name {
    font-size: 17px;
    font-weight: 700;
    color: #1A56DB;
    margin: 6px 0 20px;
  }

  .status-yes { color: #16A34A; }
  .status-no  { color: #DC2626; }
  .status-err { color: #CA8A04; }

  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #E2E8F0;
    border-top-color: #1A56DB;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }

  .rsvp-btn {
    padding: 14px 18px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: transform 0.15s, opacity 0.15s;
  }
  .rsvp-btn:active { transform: scale(0.97); }
  .rsvp-btn:disabled { opacity: 0.6; cursor: default; }

  .btn-yes { background: #DCFCE7; color: #16A34A; }
  .btn-no  { background: #FEE2E2; color: #DC2626; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Inapakia...</h1>
  <p>Tafadhali subiri kidogo</p>
</div>

<script>
const SUPABASE_URL = 'https://fymjjqembyrlwgktbcgf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SMflxbKh4452586Q4ojrow_L4ZGq2uu';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const card = document.getElementById('card');
let currentCardId = null;

function showInvalidLink() {
  card.innerHTML = `
    <div class="icon">⚠️</div>
    <h1 class="status-err">Link Batili</h1>
    <p>Link hii haina taarifa sahihi. Tafadhali tumia link uliyotumiwa kwenye ujumbe wa WhatsApp.</p>`;
}

function showChoiceScreen(guestName) {
  card.innerHTML = `
    <div class="icon">📩</div>
    <h1>Thibitisha Uwepo Wako</h1>
    ${guestName ? `<div class="guest-name">${guestName}</div>` : ''}
    <p>Tafadhali chagua moja kati ya chaguo hapa chini:</p>
    <div class="btn-row">
      <button class="rsvp-btn btn-yes" id="btnYes" onclick="submitChoice('yes')">✅ Nitahudhuria</button>
      <button class="rsvp-btn btn-no" id="btnNo" onclick="submitChoice('no')">❌ Sitahudhuria</button>
    </div>
  `;
}

async function submitChoice(status) {
  document.getElementById('btnYes').disabled = true;
  document.getElementById('btnNo').disabled = true;
  document.getElementById(status === 'yes' ? 'btnYes' : 'btnNo').textContent = 'Inatuma...';

  // "Last click wins": tunatuma hali mpya kila mara - hata kama alishajibu awali,
  // jibu la MWISHO alilobonyeza ndilo litakalobaki kwenye mfumo.
  const { data, error } = await sb.rpc('submit_rsvp', {
    card_id_input: currentCardId,
    status_input: status
  });

  if (error || !data || data.success === false) {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h1 class="status-err">Imeshindwa</h1>
      <p>${(data && data.message) || 'Kadi hii haikupatikana kwenye mfumo. Tafadhali wasiliana na mwenyeji.'}</p>`;
    return;
  }

  if (status === 'yes') {
    card.innerHTML = `
      <div class="icon">🎉</div>
      <h1 class="status-yes">Tunashukuru kwa uwepo wako</h1>
      <p><strong>Karibu sana!</strong></p>`;
  } else {
    card.innerHTML = `
      <div class="icon">🙏</div>
      <h1 class="status-no">Pole kwa dharura</h1>
      <p><strong>Karibu Tena</strong></p>`;
  }
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const cardId = params.get('id');

  if (!cardId) {
    showInvalidLink();
    return;
  }

  currentCardId = cardId;
  // Hakuna haja ya kupata jina la mgeni kabla - moja kwa moja tunaonyesha
  // chaguo mbili. Ukitaka jina lionekane hapo juu, unaweza kuongeza RPC
  // ya kusoma jina peke yake (bila taarifa nyingine nyeti) baadaye.
  showChoiceScreen(null);
}

init();
</script>

</body>
</html>
