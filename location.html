<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maelekezo ya Tukio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --blue: #1A56DB;
    --blue-dark: #1340A8;
    --blue-light: #EBF2FF;
    --orange: #F97316;
    --white: #FFFFFF;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-400: #94A3B8;
    --gray-600: #475569;
    --gray-800: #1E293B;
    --green: #10B981;
    --red: #EF4444;
    --radius: 12px;
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(160deg, var(--blue-light), var(--gray-50));
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--gray-800);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 28px 24px;
    text-align: center;
  }
  .pin {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--gray-800);
  }
  .event-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--blue);
    margin: 0 0 14px;
  }
  .details {
    background: var(--gray-50);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 13.5px;
    color: var(--gray-600);
    text-align: left;
  }
  .details div { padding: 3px 0; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 18px;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-primary {
    background: var(--blue);
    color: var(--white);
  }
  .btn-primary:active { background: var(--blue-dark); }
  .btn-outline {
    background: var(--white);
    color: var(--gray-600);
    border: 1px solid var(--gray-200);
    font-weight: 600;
    font-size: 13.5px;
  }
  .hint {
    font-size: 11.5px;
    color: var(--gray-400);
    margin-top: 14px;
    line-height: 1.5;
  }
  .state-msg {
    font-size: 14px;
    color: var(--gray-600);
    padding: 20px 0;
  }
  .icon-lg { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="state-msg">⏳ Inapakia maelekezo...</div>
  </div>

<script>
const SUPABASE_URL = 'https://fymjjqembyrlwgktbcgf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SMflxbKh4452586Q4ojrow_L4ZGq2uu';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

function formatTimeAMPM(time24) {
  if (!time24) return '';
  const [hStr, mStr] = time24.split(':');
  let h = parseInt(hStr, 10);
  const m = mStr || '00';
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}

function buildDirectionsUrl(coords) {
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(coords)}`;
}
function buildPinUrl(coords) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coords)}`;
}

function renderState(html) {
  document.getElementById('card').innerHTML = html;
}

function renderError(msg, technicalDetail) {
  renderState(`
    <div class="icon-lg">⚠️</div>
    <h1>Samahani</h1>
    <div class="state-msg" style="padding-top:0;">${msg}</div>
    ${technicalDetail ? `<div style="margin-top:14px;padding:10px 12px;background:var(--gray-50);border-radius:8px;font-size:11px;color:var(--gray-400);text-align:left;word-break:break-all;">🔧 Maelezo ya kiufundi (kwa msimamizi):<br>${technicalDetail}</div>` : ''}
  `);
}

async function loadLocation() {
  const params = new URLSearchParams(window.location.search);
  const cardId = params.get('id');
  if (!cardId) return renderError('Kiungo hiki si sahihi - hakina kitambulisho cha mgeni.');

  // Tunatumia RPC salama (get_location_for_card) badala ya kusoma majedwali
  // ya guests/events moja kwa moja - hii inazuia ukurasa huu wa umma (bila
  // login) kufungua jedwali zima kwa dunia, ni row MOJA tu inayolingana
  // na card_id iliyotolewa ndiyo inayorudishwa.
  const { data, error } = await sb.rpc('get_location_for_card', { p_card_id: cardId });
  const row = Array.isArray(data) ? data[0] : data;

  if (error || !row) {
    console.error('location.html - get_location_for_card error:', error, 'cardId used:', cardId);
    return renderError(
      'Mgeni hajapatikana kwa kiungo hiki.',
      `card_id="${cardId}" | ${error ? (error.code || '') + ' - ' + error.message : 'Hakuna row iliyorudishwa (0 results)'}`
    );
  }

  const coords = (row.coordinates || '').trim();
  if (!coords) {
    return renderError('Mwenyeji hajaweka bado eneo la GPS la tukio hili. Tafadhali muulize mwenyeji mahali halisi.');
  }

  const dirUrl = buildDirectionsUrl(coords);
  const pinUrl = buildPinUrl(coords);
  const date = row.event_date || '';
  const time = formatTimeAMPM(row.event_time || '');
  const venue = row.venue || '';

  let details = '';
  if (date) details += `<div>📅 ${date}${time ? ' · ' + time : ''}</div>`;
  if (venue) details += `<div>📍 ${venue}</div>`;

  renderState(`
    <div class="pin">📍</div>
    <h1>Maelekezo ya Kufika</h1>
    <p class="event-name">${row.event_name || 'Tukio'}</p>
    ${details ? `<div class="details">${details}</div>` : ''}
    <a class="btn btn-primary" href="${dirUrl}" target="_blank" rel="noopener noreferrer">🧭 Fungua Maelekezo (Njia)</a>
    <a class="btn btn-outline" href="${pinUrl}" target="_blank" rel="noopener noreferrer">📌 Ona Pini Kwenye Ramani</a>
    <p class="hint">Bonyeza "Fungua Maelekezo" - itafungua Google Maps na kukuonyesha njia kutoka ulipo hadi eneo la tukio.</p>
  `);
}

loadLocation();
</script>
</body>
</html>
